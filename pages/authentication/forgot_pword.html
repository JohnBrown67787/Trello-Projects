<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Forgot Password - ShopEase</title>
    <link rel="stylesheet" href="forgot_pword.css" />
  </head>
  <body>
    <nav class="navbar">
      <div class="logo-container">
        <div class="logo-icon">
          <div class="logo-dot"></div>
        </div>
        <span class="logo-text">ShopEase</span>
      </div>
      <div class="nav-links">
        <a href="../../index.html" class="nav-item">Home</a>
        <a href="../../index.html" class="nav-item">Products</a>
        <a href="#" class="nav-item">About</a>
        <button class="btn btn-primary">Sign Up</button>
      </div>
    </nav>

    <main class="main-content">
      <div class="card">
        <div class="card-body">
          <h1 class="card-title">Forgot Password?</h1>
          <p class="card-subtitle">
            Enter your email address and we'll send you a link to reset your
            password.
          </p>

          <form id="resetForm">
            <div class="form-group">
              <label class="form-label">Email</label>
              <input
                type="email"
                id="email"
                placeholder="name@company.com"
                class="form-input"
              />
            </div>

            <button type="submit" class="btn btn-primary btn-full">
              Send Reset Link
            </button>
          </form>

          <div class="back-link-container">
            <a href="login.html" class="back-link">
              <svg
                class="back-icon"
                fill="none"
                stroke="currentColor"
                viewBox="0 0 24 24"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="2"
                  d="M10 19l-7-7m0 0l7-7m-7 7h18"
                ></path>
              </svg>
              Back to Login
            </a>
          </div>
        </div>

        <div class="card-footer">
          <p class="help-text">
            Need more help?
            <a href="#" class="support-link">Contact Support</a>
          </p>
        </div>
      </div>
    </main>

    <footer class="page-footer">© 2023 ShopEase. All rights reserved.</footer>

    <!-- Supabase & Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../../backend/auth/supabase-client.js"></script>
    <script src="forgot_pword.js"></script>
    <script src="script.js"></script>
  </body>
</html>
