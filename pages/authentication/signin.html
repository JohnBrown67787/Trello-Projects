<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign Up - ShopEase</title>
    <!-- Use shared styles for consistency -->
    <link rel="stylesheet" href="../../style.css" />
  </head>
  <body>
    <!-- Navigation Bar -->
    <nav class="navbar">
      <a href="#" class="brand">
        <!-- Logo Icon (SVG) -->
        <svg
          class="logo-icon"
          xmlns="http://www.w3.org/2000/svg"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path
            d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"
          ></path>
          <polyline points="3.27 6.96 12 12.01 20.73 6.96"></polyline>
          <line x1="12" y1="22.08" x2="12" y2="12"></line>
        </svg>
        ShopEase
      </a>
      <div class="nav-links">
        <a href="../../index.html" class="nav-link">Home</a>
        <a href="../../index.html" class="nav-link">Products</a>
        <a href="#" class="nav-link">About</a>
        <!-- Link to Login Page -->
        <a href="login.html" class="nav-btn">Login</a>
      </div>
    </nav>

    <!-- Main Content Area -->
    <main class="main-container">
      <!-- Sign Up Card -->
      <div class="auth-card">
        <div class="auth-header">
          <h1 class="auth-title">Create Account</h1>
          <p class="auth-subtitle">Join ShopEase today and start shopping.</p>
        </div>

        <!-- Registration Form -->
        <form id="signupForm" action="#" method="POST">
          <div class="form-group">
            <label for="fullname" class="form-label">Full Name</label>
            <input
              type="text"
              id="fullname"
              name="fullname"
              class="form-input"
              placeholder="John Doe"
              required
            />
          </div>

          <div class="form-group">
            <label for="email" class="form-label">Email</label>
            <input
              type="email"
              id="email"
              name="email"
              class="form-input"
              placeholder="name@company.com"
              required
            />
          </div>

          <div class="form-group">
            <label for="password" class="form-label">Password</label>
            <div class="password-wrapper">
              <input
                type="password"
                id="password"
                name="password"
                class="form-input"
                placeholder="••••••••"
                required
              />
              <!-- Password Visibility Toggle -->
              <button
                type="button"
                class="toggle-password"
                aria-label="Show Password"
              >
                <svg
                  xmlns="http://www.w3.org/2000/svg"
                  width="20"
                  height="20"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                >
                  <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                  <circle cx="12" cy="12" r="3"></circle>
                </svg>
              </button>
            </div>
          </div>

          <!-- Error Message Container -->
          <div
            id="auth-error-message"
            class="error-message"
            style="
              display: none;
              margin-bottom: 1rem;
              padding: 0.5rem;
              background-color: #fef2f2;
              border: 1px solid #ef4444;
              border-radius: 6px;
            "
          ></div>

          <button type="submit" class="btn-submit">
            Create Account
            <svg
              xmlns="http://www.w3.org/2000/svg"
              width="18"
              height="18"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
              <circle cx="8.5" cy="7" r="4"></circle>
              <line x1="20" y1="8" x2="20" y2="14"></line>
              <line x1="23" y1="11" x2="17" y2="11"></line>
            </svg>
          </button>
        </form>

        <div class="divider">Or sign up with</div>

        <div class="social-buttons">
          <!-- Google Button -->
          <button type="button" class="btn-social">
            <svg
              class="social-icon"
              xmlns="http://www.w3.org/2000/svg"
              viewBox="0 0 24 24"
            >
              <path
                d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"
                fill="#4285F4"
              />
              <path
                d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"
                fill="#34A853"
              />
              <path
                d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"
                fill="#FBBC05"
              />
              <path
                d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"
                fill="#EA4335"
              />
            </svg>
            Google
          </button>
          <!-- Facebook Button -->
          <button type="button" class="btn-social">
            <svg
              class="social-icon"
              xmlns="http://www.w3.org/2000/svg"
              viewBox="0 0 24 24"
              fill="#1877F2"
            >
              <path
                d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"
              />
            </svg>
            Facebook
          </button>
        </div>

        <div class="auth-footer-text">
          Already have an account?
          <a href="login.html" class="text-link">Log In</a>
        </div>
      </div>
    </main>

    <!-- Global Footer -->
    <footer class="footer-global">© 2026 ShopEase. All rights reserved.</footer>

    <!-- Supabase & Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../../backend/auth/supabase-client.js"></script>

    <!-- Validation and Signup Script -->
    <script>
      document
        .getElementById("signupForm")
        .addEventListener("submit", async function (e) {
          e.preventDefault();

          const fullnameInput = document.getElementById("fullname");
          const emailInput = document.getElementById("email");
          const passwordInput = document.getElementById("password");
          const errorContainer = document.getElementById("auth-error-message");
          const btn = this.querySelector('button[type="submit"]');
          const originalText = btn.innerHTML;

          // Reset errors
          errorContainer.style.display = "none";
          errorContainer.textContent = "";
          emailInput.classList.remove("input-error");
          passwordInput.classList.remove("input-error");

          try {
            btn.disabled = true;
            btn.textContent = "Creating Account...";

            const { data, error } = await window.supabaseClient.auth.signUp({
              email: emailInput.value,
              password: passwordInput.value,
              options: {
                data: {
                  full_name: fullnameInput.value,
                },
              },
            });

            if (error) throw error;

            // Successful signup
            alert("Account created successfully! Please log in.");
            window.location.href = "login.html";
          } catch (err) {
            console.error("Signup Error:", err);

            // Show error message
            errorContainer.textContent =
              err.message || "Failed to create account";
            errorContainer.style.display = "block";

            btn.disabled = false;
            btn.innerHTML = originalText;
          }
        });
    </script>
    <script src="script.js"></script>
  </body>
</html>
